<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Admin - Locadora de Veículos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/style/estilo.css" rel="stylesheet" />
  </head>
  <body>
    <!-- ============ TOPO ============ -->
    <header class="topo">
      <div class="container d-flex align-items-center justify-content-between py-3">
        <span class="marca">Painel do administrador</span>
        <div class="d-flex align-items-center gap-3">
          <!-- volta para a tela de aluguel (a do cliente) -->
          <a href="/catalogo.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
            Ver catálogo
          </a>
          <!-- o admin.js liga este botão ao logout -->
          <button id="btn-sair" type="button" class="btn btn-outline-light btn-sm rounded-pill px-3">
            Sair
          </button>
        </div>
      </div>
    </header>

    <main class="container py-4">
      <!-- ============ RESUMO (4 cartões com números) ============ -->
      <!-- Os números são preenchidos pelo admin.js -->
      <section class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="cartao-black p-3 text-center">
            <div class="resumo-numero" id="r-total">0</div>
            <div class="text-muted small">Veículos</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="cartao-black p-3 text-center">
            <div class="resumo-numero" id="r-disponiveis">0</div>
            <div class="text-muted small">Disponíveis</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="cartao-black p-3 text-center">
            <div class="resumo-numero" id="r-andamento">0</div>
            <div class="text-muted small">Aluguéis em andamento</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="cartao-black p-3 text-center">
            <div class="resumo-numero" id="r-atrasados">0</div>
            <div class="text-muted small">Prazo vencido</div>
          </div>
        </div>
      </section>

      <!-- Aviso de erro geral (ex.: falha ao carregar). Começa escondido. -->
      <div id="aviso" class="alert alert-danger d-none" role="alert"></div>

      <!-- ============ ABAS: Veículos | Aluguéis ============ -->
      <!-- data-bs-toggle="pill" é do Bootstrap: troca de aba sem precisar de JS -->
      <ul class="nav nav-pills mb-3" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#aba-veiculos" type="button" role="tab">
            Veículos
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="pill" data-bs-target="#aba-alugueis" type="button" role="tab">
            Aluguéis
          </button>
        </li>
      </ul>

      <div class="tab-content">
        <!-- ---------- ABA 1: VEÍCULOS ---------- -->
        <div class="tab-pane fade show active" id="aba-veiculos" role="tabpanel">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h5 mb-0">Gerenciar veículos</h1>
            <button id="btn-novo" type="button" class="btn btn-dourado px-4">+ Novo veículo</button>
          </div>
          <div class="cartao-black p-2">
            <div class="table-responsive">
              <table class="table align-middle">
                <thead>
                  <tr>
                    <th>Veículo</th>
                    <th>Ano</th>
                    <th>Placa</th>
                    <th>Diária</th>
                    <th>Status</th>
                    <th class="text-end">Ações</th>
                  </tr>
                </thead>
                <!-- as linhas são criadas pelo admin.js -->
                <tbody id="tabela-veiculos"></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- ---------- ABA 2: ALUGUÉIS ---------- -->
        <div class="tab-pane fade" id="aba-alugueis" role="tabpanel">
          <h1 class="h5 mb-3">Aluguéis e prazos</h1>
          <div class="cartao-black p-2">
            <div class="table-responsive">
              <table class="table align-middle">
                <thead>
                  <tr>
                    <th>Veículo</th>
                    <th>Cliente</th>
                    <th>Retirada</th>
                    <th>Devolução</th>
                    <th>Dias</th>
                    <th>Prazo</th>
                    <th>Pagamento</th>
                    <th>Valor</th>
                    <th class="text-end">Ações</th>
                  </tr>
                </thead>
                <tbody id="tabela-alugueis"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- ============ MODAL: cadastrar / editar veículo ============ -->
    <!-- Um só modal serve para os dois: o admin.js troca o título e preenche os campos -->
    <div class="modal fade" id="modal-veiculo" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content cartao-black">
          <form id="form-veiculo" novalidate>
            <div class="modal-header border-0">
              <h2 class="modal-title h5" id="veiculo-titulo">Novo veículo</h2>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
              <!-- erros devolvidos pelo servidor (ex.: "Placa inválida") -->
              <div id="veiculo-erro" class="alert alert-danger d-none" role="alert"></div>
              <div class="row g-3">
                <div class="col-6">
                  <label for="v-marca" class="form-label">Marca</label>
                  <input id="v-marca" class="form-control" maxlength="40" required />
                </div>
                <div class="col-6">
                  <label for="v-modelo" class="form-label">Modelo</label>
                  <input id="v-modelo" class="form-control" maxlength="60" required />
                </div>
                <div class="col-4">
                  <label for="v-ano" class="form-label">Ano</label>
                  <input id="v-ano" type="number" class="form-control" min="1990" required />
                </div>
                <div class="col-4">
                  <label for="v-placa" class="form-label">Placa</label>
                  <input id="v-placa" class="form-control text-uppercase" maxlength="8" placeholder="ABC1D23" required />
                </div>
                <div class="col-4">
                  <label for="v-preco" class="form-label">Diária (R$)</label>
                  <input id="v-preco" type="number" step="0.01" min="0.01" class="form-control" required />
                </div>
                <div class="col-12">
                  <label for="v-imagem" class="form-label">Foto do veículo (JPG, PNG ou WebP, até 2 MB)</label>
                  <input id="v-imagem" type="file" accept="image/jpeg,image/png,image/webp" class="form-control" />
                  <!-- foto atual (aparece só na edição, se o veículo já tiver foto) -->
                  <div id="v-imagem-atual" class="d-flex align-items-center gap-3 mt-2 d-none">
                    <img id="v-imagem-previa" alt="Foto atual" class="miniatura-foto" />
                    <button type="button" id="v-imagem-remover" class="btn btn-sm btn-outline-danger">Remover foto</button>
                  </div>
                </div>
                <div class="col-12">
                  <label for="v-status" class="form-label">Status</label>
                  <!-- os valores (value) são os que o banco guarda: minúsculo e sem acento -->
                  <select id="v-status" class="form-select">
                    <option value="disponivel">Disponível</option>
                    <option value="alugado">Alugado</option>
                    <option value="manutencao">Manutenção</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="modal-footer border-0">
              <button type="button" class="btn btn-outline-light rounded-pill" data-bs-dismiss="modal">
                Cancelar
              </button>
              <button type="submit" id="btn-salvar-veiculo" class="btn btn-dourado px-4">Salvar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- ============ MODAL: alterar período (dias) do aluguel ============ -->
    <div class="modal fade" id="modal-periodo" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content cartao-black">
          <form id="form-periodo" novalidate>
            <div class="modal-header border-0">
              <h2 class="modal-title h5" id="periodo-titulo">Alterar período</h2>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
              <div id="periodo-erro" class="alert alert-danger d-none" role="alert"></div>
              <div class="row g-3">
                <div class="col-6">
                  <label for="p-inicio" class="form-label">Retirada</label>
                  <input id="p-inicio" type="date" class="form-control" required />
                </div>
                <div class="col-6">
                  <label for="p-fim" class="form-label">Devolução</label>
                  <input id="p-fim" type="date" class="form-control" required />
                </div>
              </div>
              <!-- prévia: "7 dias · novo valor R$ 1.750,00" (preenchida pelo admin.js) -->
              <p id="periodo-resumo" class="mt-3 mb-0 text-muted"></p>
            </div>
            <div class="modal-footer border-0">
              <button type="button" class="btn btn-outline-light rounded-pill" data-bs-dismiss="modal">
                Cancelar
              </button>
              <button type="submit" id="btn-salvar-periodo" class="btn btn-dourado px-4">Salvar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- O JS do Bootstrap é necessário para as abas e os modais -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/admin.js"></script>
  </body>
</html>
