<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Locadora de Veículos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/style/estilo.css" rel="stylesheet" />
  </head>
  <body>
    <main class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
      <div class="cartao-black w-100" style="max-width: 400px">
        <div class="p-4 p-md-5">
          <div class="chip"></div>
          <h1 class="h4 mb-1">Locadora de Veículos</h1>
          <p id="subtitulo" class="text-muted mb-4">Acesse sua conta</p>

          <div id="erro" class="alert alert-danger d-none" role="alert"></div>
          <div id="sucesso" class="alert alert-success d-none" role="status"></div>

          <!-- LOGIN -->
          <form id="form-login" novalidate>
            <div class="mb-3">
              <label for="login-email" class="form-label">E-mail</label>
              <input
                type="email"
                class="form-control"
                id="login-email"
                name="email"
                autocomplete="username"
                required
              />
            </div>

            <div class="mb-4">
              <label for="senha" class="form-label">Senha</label>
              <input
                type="password"
                class="form-control"
                id="senha"
                name="senha"
                autocomplete="current-password"
                required
              />
            </div>

            <button type="submit" id="btn-entrar" class="btn btn-dourado w-100">
              Entrar
            </button>
          </form>

          <!-- REGISTRO -->
          <form id="form-registro" class="d-none" novalidate>
            <div class="mb-3">
              <label for="reg-nome" class="form-label">Nome completo</label>
              <input
                type="text"
                class="form-control"
                id="reg-nome"
                name="nome"
                autocomplete="name"
                maxlength="100"
                required
              />
            </div>

            <div class="mb-3">
              <label for="reg-cpf" class="form-label">CPF</label>
              <input
                type="text"
                class="form-control"
                id="reg-cpf"
                name="cpf"
                inputmode="numeric"
                placeholder="000.000.000-00"
                maxlength="14"
                required
              />
            </div>

            <div class="mb-3">
              <label for="reg-email" class="form-label">E-mail</label>
              <input
                type="email"
                class="form-control"
                id="reg-email"
                name="email"
                autocomplete="email"
                maxlength="120"
                required
              />
            </div>

            <div class="mb-3">
              <label for="reg-senha" class="form-label">Senha</label>
              <input
                type="password"
                class="form-control"
                id="reg-senha"
                name="senha"
                autocomplete="new-password"
                minlength="8"
                required
              />
              <ul id="regras-senha">
                <li data-regra="tamanho">No mínimo 8 caracteres</li>
                <li data-regra="maiuscula">Uma letra maiúscula</li>
                <li data-regra="numero">Um número</li>
                <li data-regra="especial">Um caractere especial</li>
              </ul>
            </div>
            <div class="mb-4">
              <label for="reg-confirmar" class="form-label">Confirmar senha</label>
              <input
                type="password"
                class="form-control"
                id="reg-confirmar"
                name="confirmar"
                autocomplete="new-password"
                required
              />
            </div>

            <button type="submit" id="btn-registrar" class="btn btn-dourado w-100">
              Criar conta
            </button>
          </form>

          <p class="text-center text-muted mt-4 mb-0">
            <span id="texto-troca">Não tem conta?</span>
            <a href="#" id="link-troca" class="link-dourado">Registre-se</a>
          </p>
        </div>
      </div>
    </main>

    <script src="/static/login.js"></script>
  </body>
</html>
