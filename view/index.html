<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Locadora de Veículos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/static/estilo.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@600&display=swap" rel="stylesheet">
  </head>
  <body>
    <main class="container d-flex align-items-center justify-content-center min-vh-100">
      <div class="cartao-black w-100" style="max-width: 400px">
        <div class="p-4 p-md-5">
          <div class="chip"></div>
          <h1 class="h4 mb-1">Locadora de Veículos</h1>
          <p class="text-muted mb-4">Acesse sua conta</p>

          <div id="erro" class="alert alert-danger d-none" role="alert"></div>

          <form id="form-login" novalidate>
            <div class="mb-3">
              <label for="login" class="form-label">Usuário</label>
              <input
                type="text"
                class="form-control"
                id="login"
                name="login"
                autocomplete="username"
                required
              />
            </div>

            <div class="mb-4">
              <label for="senha" class="form-label">Senha</label>
              <input
                type="password"
                class="form-control"
                id="senha"
                name="senha"
                autocomplete="current-password"
                required
              />
            </div>

            <button type="submit" id="btn-entrar" class="btn btn-dourado w-100">
              Entrar
            </button>
          </form>
        </div>
      </div>
    </main>

    <script src="/static/login.js"></script>
  </body>
</html>
