<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veículos - Locadora de Veículos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/style/estilo.css" rel="stylesheet" />
    <link href="/style/estilo.css" rel="stylesheet" />
  </head>
  <body>
    <header class="topo">
      <div class="container d-flex align-items-center justify-content-between py-3">
        <span class="marca">Locadora de Veículos</span>
        <button type="button" class="btn btn-outline-light btn-sm rounded-pill px-3">
          Sair
        </button>
      </div>
    </header>

    <main class="container py-4">
      <div class="mb-4">
        <h1 class="h3 mb-1">Escolha seu veículo</h1>
        <p class="text-muted mb-0">
          <span id="contador">0</span> veículos encontrados
        </p>
      </div>

      <!-- Filtros -->
      <section class="cartao-black p-3 mb-4">
        <div class="row g-3 align-items-end">
          <div class="col-12 col-md-4">
            <label for="busca" class="form-label">Buscar</label>
            <input
              type="text"
              id="busca"
              class="form-control busca::placeholder "
              placeholder="Marca ou modelo"
            />
          </div>
          <div class="col-6 col-md-2">
            <label for="filtro-marca" class="form-label">Marca</label>
            <select id="filtro-marca" class="form-select">
              <option value="">Todas</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <label for="ordenar" class="form-label">Ordenar por</label>
            <select id="ordenar" class="form-select">
              <option value="menor">Menor preço</option>
              <option value="maior">Maior preço</option>
              <option value="novo">Mais novos</option>
            </select>
          </div>
          <div class="col-12 col-md-3">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="so-disponiveis" />
              <label class="form-check-label" for="so-disponiveis">
                Somente disponíveis
              </label>
            </div>
          </div>
        </div>
      </section>

      <!-- Lista de carros (preenchida pelo catalogo.js) -->
      <section id="lista" class="row g-4"></section>

      <div id="vazio" class="text-center text-muted py-5 d-none">
        Nenhum veículo encontrado com esses filtros.
      </div>
    </main>

    <script src="/static/catalogo.js"></script>
  </body>
</html>
